[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jester-trainer"
version = "0.1.0"
description = "Jester component 5/5: RM-managed distributed facet training coordinator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "psutil>=5.9,<8",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "torch>=2.2,<3",
  "safetensors>=0.4",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
jester-trainer = "jester_trainer.cli:main"
j-train = "jester_trainer.cli:main"

[tool.setuptools.packages.find]
include = ["jester_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
